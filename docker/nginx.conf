# Serves the built React app and reverse-proxies /api/* to the backend container.
# Same-origin from the browser's point of view, so the backend's localhost-only CORS
# regex (mobility_advisor/api/app.py) is never exercised.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No trailing slash on the proxy_pass target and no rewrite: every backend route
    # declares its own literal "/api/..." prefix (e.g. @router.post("/api/analyze")),
    # so "/api" must reach uvicorn intact.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The optimization pipeline runs four LLM agents in sequence; nginx's 60s
        # default read timeout will 504 a real analysis run well before it finishes.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # SPA routing: unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
